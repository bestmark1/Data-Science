# Форма проекта. Каждое поле — ответ на вопрос, который родила находка на
# реальном кейсе. Пустых умолчаний нет намеренно: умолчание, совпадающее с
# честным ответом, неотличимо от пропуска.
#
# Что здесь НЕ описывается: как построить таблицу решений из исходных таблиц.
# Это код проекта. Соединение пяти таблиц разного уровня декларацией не
# выражается, и конфигурация, в которой прячется программа, хуже программы.

title: "НАЗВАНИЕ ПРОЕКТА"

# --- схема ------------------------------------------------------------------
# Ядро не знает имён колонок, оно знает роли. Роли: entity_id, natural_key,
# decision_time, event_time, deadline, available_at, measured_at, status,
# outcome_component, feature, ignored.
#
# Временные роли обязаны объявить грануляцию: date или instant. Сравнение
# момента с датой дало 16.5% ложных положительных меток на первом кейсе.

columns:
  - name: ЕДИНИЦА_РЕШЕНИЯ      # то, о чём принимается одно решение
    role: entity_id

  - name: ОБЪЕКТ               # человек, устройство, счёт; если отличается
    role: natural_key

  - name: МОМЕНТ_РЕШЕНИЯ
    role: decision_time
    temporal: instant

  - name: СОБЫТИЕ
    role: outcome_component
    temporal: instant

  - name: СРОК
    role: deadline
    temporal: instant

  # Признак-агрегат объявляет окно, по которому посчитан. Мгновенное показание
  # объявляется окном НУЛЕВОЙ ДЛИНЫ, а не отсутствием окна.
  #
  # measured_at указывает колонку с временем получения значения. Если она есть,
  # объявленное окно сверяется с данными. Если нет — окно остаётся
  # объявлением, и это будет сказано в отчёте.
  - name: ПРИЗНАК
    role: feature
    availability: at_decision     # at_decision | after | unknown
    source_of_claim: "чем подтверждена доступность: владелец, схема, лог"
    window_lookback_days: 0
    window_lag_days: 0.0          # отступ от момента решения
    window_source: "чем подтверждено окно: код построения признака, владелец"
    # measured_at: КОЛОНКА_ВРЕМЕНИ_ИЗМЕРЕНИЯ

# --- контракт исхода --------------------------------------------------------

outcome:
  event_column: СОБЫТИЕ
  deadline_column: СРОК
  comparison: by_date            # by_date | direct
  # Какая сторона положительна. Умолчания нет: направление, выбранное молча,
  # дало долю противоположного класса на втором кейсе.
  positive_class: event_after_deadline   # event_after_deadline | event_within_deadline
  estimand: "что именно оценивается, словами"

  # Причины, по которым события могло не быть. Каждая объявляет смысл:
  # not_occurred (события не было — это наблюдение), unobserved (исход ещё не
  # наблюдаем), excluded (объект не предполагался к обработке).
  #
  # Причина, различимая по данным, называет status_value. Неразличимая ОБЯЗАНА
  # назвать допущение: неназванное допущение неотличимо от его отсутствия.
  missing_causes:
    - name: "события не произошло"
      meaning: not_occurred
      status_value: ЗНАЧЕНИЕ_СТАТУСА
    - name: "ПРИЧИНА, КОТОРУЮ ПО ДАННЫМ НЕ ОТЛИЧИТЬ"
      meaning: not_occurred
      assumption: "что принимается на веру"

# --- тип задачи -------------------------------------------------------------
# Предпосылки выключают проверки. Объявленные наугад, они выключают их ради
# тишины, поэтому has_process и is_stream сверяются с данными (S6).

task:
  target_kind: binary            # binary | regression | ranking | survival | uplift
  outcome_timing: delayed        # delayed | immediate
  has_process: false             # есть ли колонка статуса процесса
  is_stream: false               # собираются ли решения регулярным календарём
  # Одноразовый объект (заказ) или долгоживущий (машина, клиент, пациент).
  # Из данных не выводится: намеренное дробление и подмена ключа выглядят
  # одинаково.
  object_lifetime: one_shot      # one_shot | recurring

# --- сплит ------------------------------------------------------------------
# Смещения в днях от первого решения. Резерв обязателен: скользящие окна
# вложены и пересекаются по составу, поэтому ни одно из них не годится в
# измерительный инструмент после того, как хоть одно использовалось для выбора.

split:
  windows:
    - {name: w0, start_day: 180, stop_day: 240}
    - {name: w1, start_day: 240, stop_day: 300}
    - {name: w2, start_day: 300, stop_day: 360}
  reserve_from_day: 400

# --- допущения --------------------------------------------------------------
# Минимум одно. Проект без единого записанного допущения означает, что их
# принимали молча. Основание: data | owner | document | domain_knowledge.
# Следствие обязательно: допущение без цены ошибки не помогает решить,
# стоит ли его проверять.

assumptions:
  - statement: "что принято"
    basis: domain_knowledge
    author: "кто принял"
    consequence: "что будет неверно, если допущение ложно"
