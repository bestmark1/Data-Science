# Форма проекта. Каждое поле — ответ на вопрос, который родила находка на
# реальном кейсе. Пустых умолчаний нет намеренно: умолчание, совпадающее с
# честным ответом, неотличимо от пропуска.
#
# Что здесь НЕ описывается: как построить таблицу решений из исходных таблиц.
# Это код проекта. Соединение пяти таблиц разного уровня декларацией не
# выражается, и конфигурация, в которой прячется программа, хуже программы.

title: "НАЗВАНИЕ ПРОЕКТА"

# Конец наблюдения: до какого момента исходы регистрировались. Из данных не
# выводится — максимум даты события это последнее СЛУЧИВШЕЕСЯ событие, а не
# конец сбора. Между ними лежит период без событий, неотличимый от периода,
# которого в выгрузке нет.
observed_until: 2024-01-01T00:00:00
observed_until_source: "чем подтверждено: дата выгрузки, регламент, владелец"

# --- допущения: заполняются ПЕРВЫМИ ---
# Раздел стоит первым намеренно. Допущения о качестве данных и устойчивости
# процесса определяют схему и контракт, а не подводят под них итог. Заполненные
# последними, они подгоняются под уже выбранную конфигурацию.-----------------------------------------------------------
# Минимум одно. Проект без единого записанного допущения означает, что их
# принимали молча. Основание: data | owner | document | domain_knowledge.
# Следствие обязательно: допущение без цены ошибки не помогает решить,
# стоит ли его проверять.

assumptions:
  - statement: "что принято"
    basis: domain_knowledge      # data | owner | document | domain_knowledge
    author: "кто принял"
    consequence: "что будет неверно, если допущение ложно"
    # evidence: "расчёт, письмо, страница регламента — если основание data"

# --- схема ------------------------------------------------------------------
# Ядро не знает имён колонок, оно знает роли. Роли: entity_id, natural_key,
# group_id, decision_time, event_time, deadline, available_at, measured_at,
# status, event_kind, observation_reason, outcome_component, feature, ignored.
#
# КАЖДАЯ колонка таблицы обязана быть объявлена, в том числе ролью ignored:
# ядро видит только объявленное, и промолчать о колонке значит спрятать её от
# всех проверок разом (S8).
#
# Временные роли обязаны объявить грануляцию: instant, date или month.
# Сравнение момента с датой дало 16.5% ложных положительных меток на первом
# кейсе. Месяц добавлен девятым: там обещанный срок записан месяцем ВСЕГДА, а
# дата исполнения смешанная, и способ развернуть месяц менял ответ на десять
# процентных пунктов. Колонка с разной точностью по строкам объявляет САМУЮ
# ГРУБУЮ: сравнение надёжно настолько, насколько груб худший его участник.
# Приведение к дате (comparison: by_date) лечит расхождение дата/момент и
# НЕ ЛЕЧИТ месяц.

columns:
  - name: ЕДИНИЦА_РЕШЕНИЯ      # то, о чём принимается одно решение
    role: entity_id

  - name: ОБЪЕКТ               # человек, устройство, счёт; если отличается
    role: natural_key

  - name: МОМЕНТ_РЕШЕНИЯ
    role: decision_time
    temporal: instant

  - name: СОБЫТИЕ
    role: outcome_component
    temporal: instant

  - name: СРОК
    role: deadline
    temporal: instant
    # НА КАКОЙ МОМЕНТ зафиксировано значение срока. Обязательно (S10).
    #
    # Отличается от measured_at предметом: тот отвечает, КОГДА значение
    # получено, этот — КАКОМУ МОМЕНТУ оно соответствует. У неизменяемой
    # величины это одно и то же; у поля, которое источник переписывает, — нет.
    #
    # Девятый кейс: срок клинического исследования пересматривался у 73.9%
    # записей с медианой 184 дня, а у завершившихся переписывался в дату
    # самого завершения. Взятый из свежей выгрузки, он давал 100% сдержанных
    # обещаний вместо 36.5% — разницу в 63.5 процентных пункта.
    #
    # Обычный ответ — колонка момента решения: срок назначен тогда и не менялся.
    value_as_of: МОМЕНТ_РЕШЕНИЯ

  # ПРИЧИНА НАБЛЮДЕНИЯ: почему эта строка вообще существует. Объявляется, когда
  # источник её записывает — проверка по жалобе или по расписанию, анализ по
  # подозрению или в порядке диспансеризации.
  #
  # Десятый кейс: у проверок по сигналу нарушение находилось в 15.0% случаев, у
  # плановых — в 35.5%, а модель, обученная на одном поводе и применённая к
  # другому, теряла 0.215 разрешающей способности.
  # - name: ПОВОД_НАБЛЮДЕНИЯ
  #   role: observation_reason

  # Уровень ВЫШЕ объекта: сеть заведений, банк, подрядчик, спонсор. Объекты
  # одной группы зависимы, и модель, видевшая соседей по группе, оценивается
  # мягче, чем на действительно новых (N14).
  # - name: ГРУППА
  #   role: group_id

  # Признак-агрегат объявляет окно, по которому посчитан. Мгновенное показание
  # объявляется окном НУЛЕВОЙ ДЛИНЫ, а не отсутствием окна.
  #
  # measured_at указывает колонку с временем получения значения. Если она есть,
  # объявленное окно сверяется с данными. Если нет — окно остаётся
  # объявлением, и это будет сказано в отчёте.
  - name: ПРИЗНАК
    role: feature
    availability: at_decision     # at_decision | after | unknown
    source_of_claim: "чем подтверждена доступность: владелец, схема, лог"
    window_lookback_days: 0
    window_lag_days: 0.0          # отступ от момента решения
    window_source: "чем подтверждено окно: код построения признака, владелец"
    # НА КАКОЙ МОМЕНТ зафиксировано значение признака. Обязательно (S10).
    #
    # Двенадцатый кейс: колонка текущего состояния, объявленная признаком
    # момента решения, имела связь с исходом в шестнадцать раз сильнее типичной
    # и всё же прошла мимо проверки утечки — сила связи не отличает утечку от
    # честного сильного признака. Отличает момент фиксации: в тех же данных
    # лежала колонка с датой состояния, позже решения у 96.6% строк.
    #
    # Обычный ответ — колонка момента решения: значение известно тогда и не
    # меняется. Если признак взят из справочника сегодняшнего состояния —
    # назовите дату среза, и проверка сверит объявление с данными.
    value_as_of: МОМЕНТ_РЕШЕНИЯ
    # ПО КАКОМУ ВРЕМЕНИ строка отбирается в окно. Обязательно у окна ненулевой
    # длины (S9).
    #
    # У записи бывает два времени: когда описанное ею случилось и когда о ней
    # стало известно. Окно по первому захватывает записи, о которых на момент
    # решения ещё не сообщили. В таблице обе колонки — просто числа, и без
    # объявления они неразличимы.
    #
    # Шестой кейс собрал два признака, различающиеся ровно этим: значения
    # расходились у 66.5% строк, а ядро не возражало ни разу.
    # window_clock: КОЛОНКА_ВРЕМЕНИ_ОТБОРА
    # measured_at: КОЛОНКА_ВРЕМЕНИ_ИЗМЕРЕНИЯ
    #
    # Куда признак двигает риск по доменному знанию. Объявляется ДО просмотра
    # данных: иначе объявление списывается с наблюдения и проверять нечего.
    # direction: increases   # increases | decreases

# --- контракт исхода --------------------------------------------------------

outcome:
  event_column: СОБЫТИЕ
  deadline_column: СРОК
  comparison: by_date            # by_date | direct
  # Какая сторона положительна. Умолчания нет: направление, выбранное молча,
  # дало долю противоположного класса на втором кейсе.
  positive_class: event_after_deadline   # event_after_deadline | event_within_deadline
  # Имена, а не утверждения. Предложение о том, что оценивается, соберёт ядро
  # из positive_class, comparison и причин отсутствия события: направление,
  # объявленное дважды, однажды разойдётся с вычислением.
  event_name: "как называется событие: «закрытие обращения», «отказ узла»"
  deadline_name: "как называется срок: «сутки от приёма», «назначенная дата»"

  # Ожидаемая доля положительного класса по доменному знанию, ДО просмотра.
  # Необязательно: ожидания может не быть, и выдумывать его хуже, чем не иметь.
  # Если есть — расхождение в разы означает ошибку фильтрации или разметки.
  # expected_positive_rate: 0.05

  # ПОРОГ НЕВЫРОЖДЕННОСТИ. Обязателен (N15): доля класса ближе к нулю или
  # единице этого объявляется вырожденной, и прогон блокируется.
  #
  # Объявляет автор, а не ядро: общего числа тут нет. Один процент вырожден для
  # просрочки доставки и совершенно законен для мошенничества, и порог,
  # назначенный ядром, кричал бы на вторых.
  #
  # Шестой кейс: первая постановка дала 95.3% одного класса, и НИ ОДНА проверка
  # не возразила — ожидаемая доля не была объявлена, и сверять было не с чем.
  # Порог выключался ровно у того, кто о вырожденности не подумал.
  degenerate_beyond: 0.05

  # Причины, по которым события могло не быть. Каждая объявляет смысл:
  # not_occurred (события не было — это наблюдение), unobserved (исход ещё не
  # наблюдаем), excluded (объект не предполагался к обработке).
  #
  # Причина, различимая по данным, называет status_value. Неразличимая ОБЯЗАНА
  # назвать допущение: неназванное допущение неотличимо от его отсутствия.
  missing_causes:
    - name: "события не произошло"
      meaning: not_occurred
      status_value: ЗНАЧЕНИЕ_СТАТУСА
    - name: "ПРИЧИНА, КОТОРУЮ ПО ДАННЫМ НЕ ОТЛИЧИТЬ"
      meaning: not_occurred
      assumption: "что принимается на веру"

  # ВНИМАНИЕ. Статус, встречающийся в данных и не названный ни одной причиной,
  # останавливает прогон. Это не придирка: неназванный статус означает, что
  # смысл отсутствия события для него не выбран, и метка была бы поставлена
  # молча.

# --- тип задачи -------------------------------------------------------------
# Предпосылки выключают проверки. Объявленные наугад, они выключают их ради
# тишины, поэтому has_process и is_stream сверяются с данными (S6).

task:
  target_kind: binary            # binary | regression | ranking | survival | uplift
  outcome_timing: delayed        # delayed | immediate
  has_process: false             # есть ли колонка статуса процесса
  is_stream: false               # собираются ли решения регулярным календарём
  # Одноразовый объект (заказ) или долгоживущий (машина, клиент, пациент).
  # Из данных не выводится: намеренное дробление и подмена ключа выглядят
  # одинаково.
  object_lifetime: one_shot      # one_shot | recurring

  # Конкурирующие исходы. Заполняются, когда событие бывает РАЗНЫХ ВИДОВ и
  # колонка вида объявлена ролью event_kind.
  #
  # Схлопнуть виды в один — решение, а не умолчание: объект, выбывший по одной
  # причине, уже не может наступить по другой, и склейка меняет смысл метки.
  # kinds_collapsed: false
  # Возможны ли два вида одновременно, и каким значением это записано.
  # simultaneous_kinds: false
  # simultaneous_kind_value: "ЗНАЧЕНИЕ_ОДНОВРЕМЕННОСТИ"

# --- сплит: заполняется ПОСЛЕДНИМ ---
# Границы окон требуют чисел, которых до знакомства с периодом наблюдения нет.
# Сначала заполните всё остальное и прогоните сборку таблицы решений: она
# напечатает период и распределение задержки метки.
# --- сплит ------------------------------------------------------------------
# Смещения в днях от первого решения. Резерв обязателен: скользящие окна
# вложены и пересекаются по составу, поэтому ни одно из них не годится в
# измерительный инструмент после того, как хоть одно использовалось для выбора.

split:
  windows:
    - {name: w0, start_day: 180, stop_day: 240}
    - {name: w1, start_day: 240, stop_day: 300}
    - {name: w2, start_day: 300, stop_day: 360}
  reserve_from_day: 400
  # Верхняя граница резерва. Нужна, когда наблюдение обрывается раньше, чем
  # последнее решение успевает созреть: иначе в резерв попадает незрелый хвост,
  # и измерение по размеченной части становится отбором полных случаев.
  # reserve_until_day: 480
