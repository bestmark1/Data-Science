# ФОРМА ЧЕТЫРНАДЦАТОГО КЕЙСА
#
# Предсказывается: будет ли обращение о состоянии улицы закрыто в течение
# суток после приёма.
#
# Кейс намеренно ОБЫЧНЫЙ: новая отрасль, ни одной новой оси. В первом прогоне
# намеренно присутствует контроль К-1 §5 пре-регистрации.

title: "NYC 311 DOT: обращение закрыто в течение суток после приёма"

# Конец наблюдения: последний день объявленной популяции плюс запас на
# созревание метки. Срез источником не публикуется — набор обновляется
# ежедневно.
observed_until: 2024-02-01T00:00:00
observed_until_source: "объявленная популяция кончается 2023-12-31; месяц запаса на закрытие обращений, принятых в конце периода"

# --- ДОПУЩЕНИЯ ---------------------------------------------------------------

assumptions:
  - statement: "моментом решения является приём обращения"
    basis: domain_knowledge
    author: "автор"
    consequence: "если очередь формируется позже — при передаче в бригаду, — момент выбран раньше, чем он происходит, и время ожидания в приёмной попадает в исход"

  - statement: "назначенного ведомством срока в данных нет"
    basis: data
    author: "автор"
    evidence: "проверено до опечатывания: колонка due_date пуста во всех 871 117 записях популяции"
    consequence: "допуск выбран правилом, а не взят из данных; если ведомство держит срок вне выгрузки, объявленный допуск может расходиться с настоящим"

  - statement: "у 43 110 обращений закрытие датировано раньше приёма"
    basis: data
    author: "автор"
    evidence: "расчёт при сборке: 43 110 строк из 871 117 (4.9%)"
    consequence: "либо обращение заведено задним числом после решения вопроса, либо в поле закрытия стоит отметка другого обращения; в обоих случаях исход такой строки не относится к её приёму"

  - statement: "почтовый индекс является объектом, о котором решения принимаются многократно"
    basis: data
    author: "автор"
    evidence: "расчёт: 100% обращений приходится на индексы, встречающиеся более одного раза"
    consequence: "если обслуживание привязано к участку дороги, а не к району, объект объявлен крупнее нужного, и зависимость между соседними обращениями остаётся невидимой"

# --- СХЕМА -------------------------------------------------------------------

columns:
  - {name: unique_key, role: entity_id}
  - {name: incident_zip, role: natural_key}
  - {name: community_board, role: group_id}
  - {name: created_date, role: decision_time, temporal: date}
  - {name: closed_date, role: event_time, temporal: date}
  - {name: due_1d, role: deadline, temporal: date, value_as_of: created_date}
  - {name: status, role: status}

  # Признаки, известные при приёме обращения.
  - {name: complaint_type, role: feature, availability: at_decision, source_of_claim: "вид обращения, присваиваемый при приёме", window_lookback_days: 0, window_source: "выгрузка 311", value_as_of: created_date}
  - {name: descriptor, role: feature, availability: at_decision, source_of_claim: "уточнение вида обращения", window_lookback_days: 0, window_source: "выгрузка 311", value_as_of: created_date}
  - {name: location_type, role: feature, availability: at_decision, source_of_claim: "тип места из обращения", window_lookback_days: 0, window_source: "выгрузка 311", value_as_of: created_date}
  - {name: address_type, role: feature, availability: at_decision, source_of_claim: "способ указания адреса", window_lookback_days: 0, window_source: "выгрузка 311", value_as_of: created_date}
  - {name: city, role: feature, availability: at_decision, source_of_claim: "город из адреса обращения", window_lookback_days: 0, window_source: "выгрузка 311", value_as_of: created_date}
  - {name: borough, role: feature, availability: at_decision, source_of_claim: "район города", window_lookback_days: 0, window_source: "выгрузка 311", value_as_of: created_date}
  - {name: council_district, role: feature, availability: at_decision, source_of_claim: "избирательный округ", window_lookback_days: 0, window_source: "выгрузка 311", value_as_of: created_date}
  - {name: open_data_channel_type, role: feature, availability: at_decision, source_of_claim: "канал подачи обращения", window_lookback_days: 0, window_source: "выгрузка 311", value_as_of: created_date}

  # Был контролем К-1: отметка проставляется при закрытии обращения, то есть
  # ПОСЛЕ исхода. Объявлялась признаком момента приёма с честным моментом
  # фиксации — и ядро возразило немедленно.
  - {name: resolution_action_updated_date, role: ignored, temporal: date}

  # Не участвуют в постановке.
  - {name: agency, role: ignored}
  - {name: street_name, role: ignored}
  - {name: landmark, role: ignored}
  - {name: due_3d, role: ignored, temporal: date}
  - {name: due_7d, role: ignored, temporal: date}
  - {name: due_30d, role: ignored, temporal: date}

# --- КОНТРАКТ ИСХОДА ---------------------------------------------------------

outcome:
  event_column: closed_date
  deadline_column: due_1d
  comparison: by_date
  positive_class: event_within_deadline
  event_name: "закрытие обращения"
  deadline_name: "сутки от приёма"
  degenerate_beyond: 0.1

  missing_causes:
    - {name: "обращение закрыто", meaning: not_occurred, status_value: "Closed",
       assumption: "закрытое обращение без даты закрытия означает потерю записи, а не отсутствие закрытия"}
    - {name: "обращение ожидает", meaning: unobserved, status_value: "Pending",
       assumption: "ожидающее обращение исхода ещё не показало"}
    - {name: "обращение назначено исполнителю", meaning: unobserved, status_value: "Assigned",
       assumption: "то же"}
    - {name: "обращение открыто", meaning: unobserved, status_value: "Open",
       assumption: "то же"}
    - {name: "обращение в работе", meaning: unobserved, status_value: "In Progress",
       assumption: "то же"}
    - {name: "обращение отменено", meaning: excluded, status_value: "Cancel",
       assumption: "отменённое обращение не предполагалось к исполнению и из популяции исключается; в популяции оно одно"}
    - {name: "состояние не указано", meaning: unobserved, status_value: "Unspecified",
       assumption: "источник сам называет состояние неуказанным; читать его отрицательным значило бы считать молчание ответом"}

# --- ТИП ЗАДАЧИ --------------------------------------------------------------

task:
  target_kind: binary
  outcome_timing: delayed
  has_process: true
  is_stream: true
  object_lifetime: recurring

# --- СПЛИТ -------------------------------------------------------------------
# Отсчёт от 2020-01-01. Метки зреют за сутки, поэтому окна ставятся вплотную.
# Первое полугодие целиком уходит в обучение первого окна: окно без обучающих
# решений ловится проверкой P8.

split:
  windows:
    - {name: w0, start_day: 182, stop_day: 548}    # вторая половина 2020 — 2021
    - {name: w1, start_day: 548, stop_day: 913}    # 2021 — 2022
    - {name: w2, start_day: 913, stop_day: 1278}   # 2022 — 2023
  reserve_from_day: 1278                           # последняя четверть периода
  reserve_until_day: 1461
