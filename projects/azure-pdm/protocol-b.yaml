title: "Azure PdM, протокол B: скользящая постановка"

# Моменты решения назначает календарь: каждая машина каждый день. Признаки —
# агрегаты телеметрии по окну назад.

columns:
  - name: decision_key
    role: entity_id
  - name: machine_key
    role: natural_key
  - name: decided_at
    role: decision_time
    temporal: instant
  - name: failed_at
    role: outcome_component
    temporal: instant
  - name: horizon_on
    role: deadline
    temporal: instant
  - name: measured_at
    role: measured_at
    temporal: instant

  # Скользящие признаки: семь суток с отступом в шесть часов. Отступ появился
  # после F-11 — без него окно захватывало показания, снятые после решения.
  - {name: volt_mean_7d, role: feature, availability: at_decision, source_of_claim: "телеметрия", window_lookback_days: 7, window_lag_days: 0.25, window_source: "код построения признаков", measured_at: measured_at}
  - {name: rotate_mean_7d, role: feature, availability: at_decision, source_of_claim: "телеметрия", window_lookback_days: 7, window_lag_days: 0.25, window_source: "код построения признаков", measured_at: measured_at}
  - {name: pressure_mean_7d, role: feature, availability: at_decision, source_of_claim: "телеметрия", window_lookback_days: 7, window_lag_days: 0.25, window_source: "код построения признаков", measured_at: measured_at}
  - {name: vibration_mean_7d, role: feature, availability: at_decision, source_of_claim: "телеметрия", window_lookback_days: 7, window_lag_days: 0.25, window_source: "код построения признаков", measured_at: measured_at}
  - {name: volt_std_7d, role: feature, availability: at_decision, source_of_claim: "телеметрия", window_lookback_days: 7, window_lag_days: 0.25, window_source: "код построения признаков", measured_at: measured_at}
  - {name: rotate_std_7d, role: feature, availability: at_decision, source_of_claim: "телеметрия", window_lookback_days: 7, window_lag_days: 0.25, window_source: "код построения признаков", measured_at: measured_at}
  - {name: pressure_std_7d, role: feature, availability: at_decision, source_of_claim: "телеметрия", window_lookback_days: 7, window_lag_days: 0.25, window_source: "код построения признаков", measured_at: measured_at}
  - {name: vibration_std_7d, role: feature, availability: at_decision, source_of_claim: "телеметрия", window_lookback_days: 7, window_lag_days: 0.25, window_source: "код построения признаков", measured_at: measured_at}
  - {name: errors_7d, role: feature, availability: at_decision, source_of_claim: "журнал ошибок", window_lookback_days: 7, window_lag_days: 0.25, window_source: "код построения признаков", measured_at: measured_at}

  # Справочник машин. Времени внесения записи нет, окно остаётся объявлением.
  - {name: age, role: feature, availability: at_decision, source_of_claim: "справочник машин", window_lookback_days: 0, window_source: "справочник машин"}
  - {name: model, role: feature, availability: at_decision, source_of_claim: "справочник машин", window_lookback_days: 0, window_source: "справочник машин"}

outcome:
  event_column: failed_at
  deadline_column: horizon_on
  comparison: direct
  positive_class: event_within_deadline
  estimand: "отказ любого компонента в течение 30 дней после дня решения"
  missing_causes:
    - name: "отказа действительно не было"
      meaning: not_occurred
      assumption: "отсутствие записи об отказе означает исправную работу, а не пробел в регистрации"
    - name: "отказ произошёл, но не зарегистрирован"
      meaning: not_occurred
      assumption: "доля незарегистрированных отказов пренебрежимо мала"
    - name: "профилактический ремонт предотвратил отказ"
      meaning: not_occurred
      assumption: "предотвращённый отказ считается отсутствием отказа, хотя это вмешательство, а не наблюдение"
    - name: "объект выведен из эксплуатации"
      meaning: not_occurred
      assumption: "вывода из эксплуатации в наблюдаемом периоде не было"

task:
  target_kind: binary
  outcome_timing: delayed
  has_process: false
  is_stream: true          # решения назначает календарь
  object_lifetime: recurring

split:
  windows:
    - {name: w0, start_day: 150, stop_day: 210}
    - {name: w1, start_day: 210, stop_day: 270}
    - {name: w2, start_day: 270, stop_day: 330}
  reserve_from_day: 340

assumptions:
  - statement: "признаки строятся по окну 7 дней назад и кончаются за 6 часов до решения"
    basis: domain_knowledge
    author: "автор"
    consequence: "окно захватывает измерения, недоступные к моменту решения, либо теряет сигнал последних суток"
  - statement: "ежедневный скоринг соответствует реальному темпу принятия решений"
    basis: domain_knowledge
    author: "автор"
    consequence: "моменты решения назначены календарём там, где вмешательство невозможно, и оценка описывает несуществующий процесс"
  - statement: "отказы разных компонентов считаются одним исходом"
    basis: domain_knowledge
    author: "автор"
    consequence: "конкурирующие отказы склеены: модель предсказывает отказ вообще, а вмешательство требуется адресное"
