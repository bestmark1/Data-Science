# ФОРМА ТРЕТЬЕГО КЕЙСА
#
# Заполнено по решениям, принятым в диалоге. Каждое непроверяемое объявление
# порождает вопрос владельцу данных автоматически — см. раздел отчёта
# «Вопросы владельцу данных».
#
# Все решения приняты. Границы окон и резерва выбраны арифметикой из периода и
# горизонта, ДО обучения любой модели и расчёта любой метрики.

title: "NYS Workers' Compensation Claims: слушание в 180 дней после сборки"

# Конец наблюдения. В socrata_metadata.json записана дата обновления выгрузки;
# максимум даты слушания на десять дней раньше и концом сбора не является.
observed_until: 2021-06-18T00:00:00
observed_until_source: "socrata_metadata.json, поле rowsUpdatedAt"

# --- ДОПУЩЕНИЯ ---------------------------------------------------------------

assumptions:
  - statement: "предсказывается фактически зарегистрированное слушание, а не потребность в нём"
    basis: domain_knowledge
    author: "автор"
    consequence: "отменённое дело без слушания считается честным отрицательным исходом; если задача на деле про потребность в разбирательстве, 22 815 таких претензий размечены неверно"

  - statement: "отменяется и не доходит до слушания 1.26% претензий"
    basis: data
    author: "автор"
    evidence: "расчёт по current_status: CASE CANCELLED без first_hearing_at — 22 815 из 1 804 676; ещё 4 559 отменённых слушание имели, и для них отмена наступила ПОСЛЕ разбирательства"
    consequence: "при выбранном estimand это не искажение, а часть предсказываемой величины; число названо, чтобы читатель мог пересчитать вывод для другой постановки"

  - statement: "две претензии одного работника неотличимы от претензий разных людей"
    basis: data
    author: "автор"
    evidence: "в схеме нет идентификатора работника: 54 колонки словаря, ни одна не описывает лицо"
    consequence: "повторные обращения одного человека попадут в разные окна как разные объекты, и утечка между обучением и оценкой останется невидимой"

  - statement: "свойства работника и травмы известны Совету к моменту сборки претензии"
    basis: document
    author: "автор"
    evidence: "словарь данных описывает их как атрибуты претензии, а не как результат разбирательства"
    consequence: "если часть из них уточняется в ходе дела, признак знает будущее, и оценка завышена"

# --- СХЕМА -------------------------------------------------------------------

