  - {name: assembled_at, role: decision_time, temporal: date}
  - {name: first_hearing_at, role: outcome_component, temporal: date}
  - {name: horizon_180d, role: deadline, temporal: date}

  # Горизонты-кандидаты, не выбранные в качестве срока.
  - {name: horizon_30d, role: ignored, temporal: date}
  - {name: horizon_90d, role: ignored, temporal: date}
  - {name: horizon_365d, role: ignored, temporal: date}

  # Признаки: обстоятельства травмы и административное окружение.
  - {name: age_at_injury, role: feature, availability: at_decision, source_of_claim: "словарь данных WCB, NYSWCB_...DataDictionary.pdf", window_lookback_days: 0, window_source: "код сборки build.py: значение берётся из строки претензии как есть"}  # возраст на момент травмы
  - {name: birth_year, role: feature, availability: at_decision, source_of_claim: "словарь данных WCB, NYSWCB_...DataDictionary.pdf", window_lookback_days: 0, window_source: "код сборки build.py: значение берётся из строки претензии как есть"}  # год рождения
  - {name: gender, role: feature, availability: at_decision, source_of_claim: "словарь данных WCB, NYSWCB_...DataDictionary.pdf", window_lookback_days: 0, window_source: "код сборки build.py: значение берётся из строки претензии как есть"}  # пол
  - {name: zip_code, role: feature, availability: at_decision, source_of_claim: "словарь данных WCB, NYSWCB_...DataDictionary.pdf", window_lookback_days: 0, window_source: "код сборки build.py: значение берётся из строки претензии как есть"}  # индекс места жительства
  - {name: county, role: feature, availability: at_decision, source_of_claim: "словарь данных WCB, NYSWCB_...DataDictionary.pdf", window_lookback_days: 0, window_source: "код сборки build.py: значение берётся из строки претензии как есть"}  # округ, где произошла травма
  - {name: weekly_wage, role: feature, availability: at_decision, source_of_claim: "словарь данных WCB, NYSWCB_...DataDictionary.pdf", window_lookback_days: 0, window_source: "код сборки build.py: значение берётся из строки претензии как есть"}  # средний недельный заработок
  - {name: wcio_body_code, role: feature, availability: at_decision, source_of_claim: "словарь данных WCB, NYSWCB_...DataDictionary.pdf", window_lookback_days: 0, window_source: "код сборки build.py: значение берётся из строки претензии как есть"}  # код части тела WCIO
  - {name: wcio_body, role: feature, availability: at_decision, source_of_claim: "словарь данных WCB, NYSWCB_...DataDictionary.pdf", window_lookback_days: 0, window_source: "код сборки build.py: значение берётся из строки претензии как есть"}  # часть тела WCIO
  - {name: wcio_nature_code, role: feature, availability: at_decision, source_of_claim: "словарь данных WCB, NYSWCB_...DataDictionary.pdf", window_lookback_days: 0, window_source: "код сборки build.py: значение берётся из строки претензии как есть"}  # код характера травмы WCIO
  - {name: wcio_nature, role: feature, availability: at_decision, source_of_claim: "словарь данных WCB, NYSWCB_...DataDictionary.pdf", window_lookback_days: 0, window_source: "код сборки build.py: значение берётся из строки претензии как есть"}  # характер травмы WCIO
  - {name: wcio_cause_code, role: feature, availability: at_decision, source_of_claim: "словарь данных WCB, NYSWCB_...DataDictionary.pdf", window_lookback_days: 0, window_source: "код сборки build.py: значение берётся из строки претензии как есть"}  # код причины травмы WCIO
  - {name: wcio_cause, role: feature, availability: at_decision, source_of_claim: "словарь данных WCB, NYSWCB_...DataDictionary.pdf", window_lookback_days: 0, window_source: "код сборки build.py: значение берётся из строки претензии как есть"}  # причина травмы WCIO
  - {name: is_accident, role: feature, availability: at_decision, source_of_claim: "словарь данных WCB, NYSWCB_...DataDictionary.pdf", window_lookback_days: 0, window_source: "код сборки build.py: значение берётся из строки претензии как есть"}  # несчастный случай
  - {name: is_occupational_disease, role: feature, availability: at_decision, source_of_claim: "словарь данных WCB, NYSWCB_...DataDictionary.pdf", window_lookback_days: 0, window_source: "код сборки build.py: значение берётся из строки претензии как есть"}  # профзаболевание
  - {name: covid_related, role: feature, availability: at_decision, source_of_claim: "словарь данных WCB, NYSWCB_...DataDictionary.pdf", window_lookback_days: 0, window_source: "код сборки build.py: значение берётся из строки претензии как есть"}  # связь с COVID-19
  - {name: industry_code, role: feature, availability: at_decision, source_of_claim: "словарь данных WCB, NYSWCB_...DataDictionary.pdf", window_lookback_days: 0, window_source: "код сборки build.py: значение берётся из строки претензии как есть"}  # код отрасли NAICS
  - {name: industry, role: feature, availability: at_decision, source_of_claim: "словарь данных WCB, NYSWCB_...DataDictionary.pdf", window_lookback_days: 0, window_source: "код сборки build.py: значение берётся из строки претензии как есть"}  # отрасль
  - {name: claim_type, role: feature, availability: at_decision, source_of_claim: "словарь данных WCB, NYSWCB_...DataDictionary.pdf", window_lookback_days: 0, window_source: "код сборки build.py: значение берётся из строки претензии как есть"}  # категория работника: WC, VF, VW
  - {name: district, role: feature, availability: at_decision, source_of_claim: "словарь данных WCB, NYSWCB_...DataDictionary.pdf", window_lookback_days: 0, window_source: "код сборки build.py: значение берётся из строки претензии как есть"}  # округ Совета
  - {name: medical_fee_region, role: feature, availability: at_decision, source_of_claim: "словарь данных WCB, NYSWCB_...DataDictionary.pdf", window_lookback_days: 0, window_source: "код сборки build.py: значение берётся из строки претензии как есть"}  # регион медицинского тарифа
  - {name: carrier_name, role: feature, availability: at_decision, source_of_claim: "словарь данных WCB, NYSWCB_...DataDictionary.pdf", window_lookback_days: 0, window_source: "код сборки build.py: значение берётся из строки претензии как есть"}  # страховщик
  - {name: carrier_type, role: feature, availability: at_decision, source_of_claim: "словарь данных WCB, NYSWCB_...DataDictionary.pdf", window_lookback_days: 0, window_source: "код сборки build.py: значение берётся из строки претензии как есть"}  # тип страховщика
  - {name: alternative_dispute_resolution, role: feature, availability: at_decision, source_of_claim: "словарь данных WCB, NYSWCB_...DataDictionary.pdf", window_lookback_days: 0, window_source: "код сборки build.py: значение берётся из строки претензии как есть"}  # альтернативное разрешение споров

  # События после сборки и даты, недоступные в момент решения.
  - {name: c2_received_at, role: ignored, temporal: date}  # форма работодателя: заполнена у 1.1%, у 37.5% из них позже сборки
  - {name: c3_received_at, role: ignored, temporal: date}  # форма работника: у 60.5% приходит ПОЗЖЕ сборки
  - {name: established_at, role: ignored, temporal: date}  # установление претензии: в 100% случаев позже сборки
  - {name: controverted_at, role: ignored, temporal: date}  # оспаривание страховщиком — событие после сборки
  - {name: ppd_scheduled_at, role: ignored, temporal: date}  # частичная стойкая по шкале — событие после сборки
  - {name: ppd_nonscheduled_at, role: ignored, temporal: date}  # частичная стойкая вне шкалы — событие после сборки
  - {name: ptd_at, role: ignored, temporal: date}  # полная стойкая — событие после сборки
  - {name: section32_at, role: ignored, temporal: date}  # соглашение: в 99.8% случаев ПОСЛЕ слушания
  - {name: first_appeal_at, role: ignored, temporal: date}  # апелляция — событие после сборки
  - {name: accident_at, role: ignored, temporal: date}  # доступна, но как дата признаком не годится: нужна производная

  # Значения на момент выгрузки. Признаками быть не могут: описывают
  # претензию после того, как она прожила годы.
  - {name: current_status, role: ignored}  # статус на момент выгрузки; использован для ОЦЕНКИ допущения, не как признак
  - {name: injury_type, role: ignored}  # тип травмы по итогу дела
  - {name: highest_process, role: ignored}  # высший достигнутый процесс
  - {name: hearing_count, role: ignored}  # число слушаний за всю жизнь дела
  - {name: closed_count, role: ignored}  # сколько раз дело закрывали
  - {name: ime4_count, role: ignored}  # число независимых экспертиз
  - {name: has_representative, role: ignored}  # наличие представителя
  - {name: days_assembled_to_established, role: ignored}  # интервал до установления: известен только после

# --- КОНТРАКТ ИСХОДА ---------------------------------------------------------

outcome:
  event_column: first_hearing_at
  deadline_column: horizon_180d
  comparison: by_date
  positive_class: event_within_deadline
  estimand: "первое слушание по претензии БУДЕТ ЗАРЕГИСТРИРОВАНО в течение 180 дней после её сборки Советом, независимо от того, требовалось ли оно по существу дела"
  # Ожидаемая доля не объявляется намеренно: наблюдаемые 9.2% были названы
  # раньше, чем ожидание могло быть записано. Объявленное теперь ничего не
  # проверяло бы. Проверка N13 пропускается, и отчёт скажет об этом прямо.

  missing_causes:
    - name: "слушание не зарегистрировано к концу срока"
      meaning: not_occurred
      assumption: "отсутствие записи о слушании означает, что слушания не было, а не пробел в регистрации; отмена дела и медленное разбирательство при выбранном estimand одинаково дают отрицательный исход"

# --- ТИП ЗАДАЧИ --------------------------------------------------------------

task:
  target_kind: binary
  outcome_timing: delayed
  has_process: false      # колонка статуса объявлена ignored: она на момент выгрузки
  is_stream: true         # сбор по рабочим дням: медиана промежутка 1 дн, максимум 3
  # Претензия одноразова: одно дело — одно решение. Защиты от попадания одного
  # работника в разные окна нет ни при каком выборе, потому что идентификатора
  # работника в данных нет. Но one_shot честно пишет, что N2i не применялась,
  # а recurring создал бы видимость проведённой проверки.
  object_lifetime: one_shot

# --- СПЛИТ -------------------------------------------------------------------
# Период сборки: 2015-01-01 .. 2021-06-04, 2346 дней.
# Метки созревают до дня 2166 (2346 минус горизонт 180).

split:
  windows:
    - {name: w0, start_day: 1440, stop_day: 1620}   # 2018-12-11 .. 2019-06-09
    - {name: w1, start_day: 1620, stop_day: 1800}   # 2019-06-09 .. 2019-12-06
    - {name: w2, start_day: 1800, stop_day: 1980}   # 2019-12-06 .. 2020-06-03
  reserve_from_day: 1980                            # с 2020-06-03
  # День 2180 — 2020-12-20, ровно 180 дней до конца наблюдения. Резерв,
  # ограниченный этой датой, зрел полностью; хвост за ней в работу не идёт и
  # выводится отдельным числом.
  reserve_until_day: 2180
