# ФОРМА ТРЕТЬЕГО КЕЙСА — заполняется вами.
#
# Что уже заполнено мной и почему:
#   - имена колонок: они определяются кодом сборки (build.py), а не решением;
#   - temporal: date — установлено проверкой: все 16 временных колонок хранят
#     календарную дату, время суток нулевое везде.
#
# Всё остальное — вопросы к вам. Каждый помечен ВОПРОС. Руководство с
# различающими вопросами: docs/filling-the-form.md
#
# Источник объявлений — настоящий: NYSWCB_...DataDictionary.pdf в data/raw.
# Ссылайтесь на него, а не на «гипотетического владельца».

title: "NYS Workers' Compensation Claims"

# --- ДОПУЩЕНИЯ: заполняются ПЕРВЫМИ -----------------------------------------
# ВОПРОС: что вы принимаете на веру про эти данные? Минимум одно.
# basis: data | owner | document | domain_knowledge
# consequence обязательно: что окажется неверным, если допущение ложно.
#
# Подсказка о том, что здесь стоит обдумать: в данных нет идентификатора
# работника. Две претензии одного человека неотличимы от претензий разных
# людей.

assumptions:
  - statement: "ЗАПОЛНИТЕ"
    basis: domain_knowledge
    author: "ЗАПОЛНИТЕ"
    consequence: "ЗАПОЛНИТЕ"

# --- СХЕМА -------------------------------------------------------------------
# Роли: entity_id, natural_key, decision_time, event_time, deadline,
#       available_at, measured_at, status, outcome_component, feature, ignored
#
# ВОПРОС по каждой колонке: чем она является в вашей постановке?
#
# ВАЖНО. Словарь данных описывает почти все неврéменные поля как значения НА
# МОМЕНТ ВЫГРУЗКИ, а не на момент решения. Претензия, собранная в 2005 году,
# несёт статус 2021 года. Отличить такое поле от значения на момент решения по
# данным нельзя — только по словарю.

columns:
  # --- ключ и момент решения
  - {name: claim_id, role: ЗАПОЛНИТЕ}                       # уникален по всем строкам
  - {name: assembled_at, role: ЗАПОЛНИТЕ, temporal: date}   # дата сборки претензии Советом

  # --- сроки-кандидаты. ВОПРОС: какой горизонт осмыслен? Один объявите
  #     deadline, остальные — ignored.
  - {name: horizon_30d, role: ЗАПОЛНИТЕ, temporal: date}
  - {name: horizon_90d, role: ЗАПОЛНИТЕ, temporal: date}
  - {name: horizon_180d, role: ЗАПОЛНИТЕ, temporal: date}
  - {name: horizon_365d, role: ЗАПОЛНИТЕ, temporal: date}

  # --- события после сборки. ВОПРОС: какое из них ваш исход?
  #     Заполненность: оспаривание 8.2%, PPD со шкалой 11.9%, PPD без шкалы
  #     2.4%, полная нетрудоспособность 0.1%, соглашение 5.3%, апелляция 3.6%.
  - {name: controverted_at, role: ЗАПОЛНИТЕ, temporal: date}       # страховщик оспорил
  - {name: ppd_scheduled_at, role: ЗАПОЛНИТЕ, temporal: date}      # частичная стойкая, по шкале
  - {name: ppd_nonscheduled_at, role: ЗАПОЛНИТЕ, temporal: date}   # частичная стойкая, вне шкалы
  - {name: ptd_at, role: ЗАПОЛНИТЕ, temporal: date}                # полная стойкая
  - {name: section32_at, role: ЗАПОЛНИТЕ, temporal: date}          # соглашение об отказе
  - {name: first_appeal_at, role: ЗАПОЛНИТЕ, temporal: date}       # первая апелляция
  - {name: first_hearing_at, role: ЗАПОЛНИТЕ, temporal: date}      # первое слушание
  - {name: established_at, role: ЗАПОЛНИТЕ, temporal: date}        # претензия установлена (ANCR)

  # --- до сборки. ВОПРОС: доступны ли они в момент решения и чем это подтверждено?
  - {name: accident_at, role: ЗАПОЛНИТЕ, temporal: date}
  - {name: c2_received_at, role: ЗАПОЛНИТЕ, temporal: date}   # форма работодателя
  - {name: c3_received_at, role: ЗАПОЛНИТЕ, temporal: date}   # форма работника

  # --- свойства работника и травмы
  - {name: age_at_injury, role: ЗАПОЛНИТЕ}
  - {name: birth_year, role: ЗАПОЛНИТЕ}
  - {name: gender, role: ЗАПОЛНИТЕ}
  - {name: zip_code, role: ЗАПОЛНИТЕ}
  - {name: county, role: ЗАПОЛНИТЕ}
  - {name: weekly_wage, role: ЗАПОЛНИТЕ}
  - {name: wcio_body_code, role: ЗАПОЛНИТЕ}
  - {name: wcio_body, role: ЗАПОЛНИТЕ}
  - {name: wcio_nature_code, role: ЗАПОЛНИТЕ}
  - {name: wcio_nature, role: ЗАПОЛНИТЕ}
  - {name: wcio_cause_code, role: ЗАПОЛНИТЕ}
  - {name: wcio_cause, role: ЗАПОЛНИТЕ}
  - {name: is_accident, role: ЗАПОЛНИТЕ}
  - {name: is_occupational_disease, role: ЗАПОЛНИТЕ}
  - {name: covid_related, role: ЗАПОЛНИТЕ}
  - {name: industry_code, role: ЗАПОЛНИТЕ}
  - {name: industry, role: ЗАПОЛНИТЕ}

  # --- административное окружение
  - {name: claim_type, role: ЗАПОЛНИТЕ}            # WC, VF, VW
  - {name: district, role: ЗАПОЛНИТЕ}
  - {name: medical_fee_region, role: ЗАПОЛНИТЕ}
  - {name: carrier_name, role: ЗАПОЛНИТЕ}
  - {name: carrier_type, role: ЗАПОЛНИТЕ}
  - {name: alternative_dispute_resolution, role: ЗАПОЛНИТЕ}

  # --- ЗНАЧЕНИЯ НА МОМЕНТ ВЫГРУЗКИ. Словарь описывает их как текущее состояние
  #     претензии, а не как состояние на момент сборки.
  - {name: current_status, role: ЗАПОЛНИТЕ}                  # 11 значений
  - {name: injury_type, role: ЗАПОЛНИТЕ}                     # 8 значений
  - {name: highest_process, role: ЗАПОЛНИТЕ}
  - {name: hearing_count, role: ЗАПОЛНИТЕ}
  - {name: closed_count, role: ЗАПОЛНИТЕ}                    # сколько раз закрывали
  - {name: ime4_count, role: ЗАПОЛНИТЕ}
  - {name: has_representative, role: ЗАПОЛНИТЕ}
  - {name: days_assembled_to_established, role: ЗАПОЛНИТЕ}

# --- КОНТРАКТ ИСХОДА ---------------------------------------------------------

outcome:
  event_column: ЗАПОЛНИТЕ        # какое событие является исходом
  deadline_column: ЗАПОЛНИТЕ     # какой из horizon_* является сроком
  comparison: ЗАПОЛНИТЕ          # by_date | direct
  positive_class: ЗАПОЛНИТЕ      # event_after_deadline | event_within_deadline
  estimand: "ЗАПОЛНИТЕ словами"
  # expected_positive_rate: 0.05  # ожидаемая доля, если ожидание есть

  # ВОПРОС: почему события могло не быть? Различимая причина называет
  # status_value, неразличимая ОБЯЗАНА назвать assumption.
  missing_causes:
    - name: "ЗАПОЛНИТЕ"
      meaning: ЗАПОЛНИТЕ         # not_occurred | unobserved | excluded
      assumption: "ЗАПОЛНИТЕ, если причина неотличима по данным"

# --- ТИП ЗАДАЧИ --------------------------------------------------------------

task:
  target_kind: binary
  outcome_timing: delayed
  has_process: ЗАПОЛНИТЕ         # есть ли колонка статуса процесса
  is_stream: ЗАПОЛНИТЕ           # ритмичен ли сбор решений
  object_lifetime: ЗАПОЛНИТЕ     # one_shot | recurring

# --- СПЛИТ: заполняется ПОСЛЕДНИМ --------------------------------------------
# Смещения в днях от первой претензии. Период сборки: 2000-01-01 .. 2021-06-04.
# Резерв обязателен и не должен пересекаться ни с одним окном.

split:
  windows:
    - {name: w0, start_day: ЗАПОЛНИТЕ, stop_day: ЗАПОЛНИТЕ}
    - {name: w1, start_day: ЗАПОЛНИТЕ, stop_day: ЗАПОЛНИТЕ}
    - {name: w2, start_day: ЗАПОЛНИТЕ, stop_day: ЗАПОЛНИТЕ}
  reserve_from_day: ЗАПОЛНИТЕ
