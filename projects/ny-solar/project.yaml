# --- КОНТРАКТ ИСХОДА ---------------------------------------------------------

outcome:
  event_column: completed_at
  deadline_column: due_at
  comparison: direct
  positive_class: event_within_deadline
  estimand: "проект будет завершён в течение 180 дней после подачи заявки"
  degenerate_beyond: 0.1

  missing_causes:
    - name: "проект ещё в работе"
      meaning: not_occurred
      status_value: "Pipeline"
      assumption: "статус Pipeline означает незавершённость на дату среза, а не потерю записи о завершении"
    - name: "проект завершён"
      meaning: not_occurred
      status_value: "Complete"
      assumption: "статус Complete без даты завершения означает потерю даты, а не отсутствие события"

# --- ТИП ЗАДАЧИ --------------------------------------------------------------

task:
  target_kind: binary
  outcome_timing: delayed
  has_process: true
  is_stream: true
  object_lifetime: recurring

# --- СПЛИТ -------------------------------------------------------------------
# Отсчёт от 2000-12-21, первой заявки. Окна поставлены в плотную часть
# (2018-2024: 9-16 тыс. заявок в год). Метки зреют за 180 дней, поэтому резерв
# кончается заранее до среза 2026-07-31.

split:
  windows:
    - {name: w0, start_day: 6220, stop_day: 6950}    # 2018-01-01 .. 2020-01-01
    - {name: w1, start_day: 6950, stop_day: 7681}    # 2020-01-01 .. 2022-01-01
    - {name: w2, start_day: 7681, stop_day: 8411}    # 2022-01-01 .. 2024-01-01
  reserve_from_day: 8411                             # 2024-01-01
  reserve_until_day: 9142                            # 2026-01-01
