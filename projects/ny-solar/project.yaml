# ФОРМА ВОСЬМОГО КЕЙСА
#
# Предсказывается: будет ли солнечный проект завершён в течение 180 дней после
# подачи заявки.
#
# Кейс намеренно ОБЫЧНЫЙ: новая отрасль, ни одной новой оси.
#
# В первом прогоне форма НАМЕРЕННО содержала ложное объявление — контроль К-1
# пре-регистрации §5. Ядро назвало его само, двумя проверками сразу, и
# объявление снято.

title: "NYSERDA solar: завершение проекта в течение 180 дней после заявки"

# Конец наблюдения объявлен САМИМ ИСТОЧНИКОМ: колонка Reporting Period
# содержит единственное значение. Впервые за восемь кейсов эта величина не
# предполагается — прежде её приходилось выводить из максимума дат.
observed_until: 2026-07-31T00:00:00
observed_until_source: "колонка Reporting Period выгрузки: единственное значение 2026-07-31, объявленный источником срез"

# --- ДОПУЩЕНИЯ ---------------------------------------------------------------

assumptions:
  - statement: "моментом решения является подача заявки"
    basis: domain_knowledge
    author: "автор"
    consequence: "если решение о поддержке принимается позже подачи, момент выбран раньше, чем он происходит, и часть признаков в этот момент ещё неизвестна"

  - statement: "в выгрузке почти нет отказавшихся проектов: 186 719 завершённых против 2 616 в работе"
    basis: data
    author: "автор"
    evidence: "расчёт: Project Status принимает лишь два значения, Complete и Pipeline"
    consequence: "популяция отобрана по исходу — провалившиеся заявки в неё не попали. Предсказывается СКОРОСТЬ завершения, а не успех, и переносить вывод на успех нельзя"

  - statement: "стоимость проекта и размер субсидии известны в момент подачи заявки"
    basis: domain_knowledge
    author: "автор"
    consequence: "если они проставляются при завершении, объявление ложно, и оба признака дают знание из будущего"

  - statement: "горизонт 180 дней выбран объявленным заранее правилом, а не подбором"
    basis: data
    author: "автор"
    evidence: "доли завершения: 180 дн — 75.2%, 365 — 92.9%, 545 — 96.3%, 730 — 97.5%; правило берёт наименьший в [20%, 80%]"
    consequence: "если правило негодное, горизонт выбран неудачно, но выбран без взгляда на результат обучения"

  - statement: "подрядчик является объектом, о котором решение принимается повторно"
    basis: data
    author: "автор"
    evidence: "расчёт: 1 094 подрядчика на 189 335 заявок"
    consequence: "если заявки независимы, групповой уровень объявлен там, где его нет, и проверка N14 сработает вхолостую"

