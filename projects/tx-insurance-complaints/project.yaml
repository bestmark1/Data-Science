# ФОРМА ДЕВЯТНАДЦАТОГО КЕЙСА
#
# Предсказывается: будет ли жалоба на страховщика закрыта за 45 суток.
#
# В ПЕРВОМ ПРОГОНЕ присутствуют оба контроля §5 пре-регистрации, и оба вносятся
# не ролью отдельной колонки, а объявлением о задаче:
#
#   К-1: `respondent_id` НЕ объявлен групповым уровнем. Ожидается
#        `undeclared_group`.
#   К-2: `object_lifetime: one_shot` при `natural_key: complaint_number`,
#        повторяющемся у 3 431 жалобы. Ожидается `surrogate_key_as_entity`.
#
# Ни один не повторяет приёма, шесть кейсов подряд бывшего единственным:
# колонка исхода, объявленная признаком.

title: "Техас: будет ли жалоба на страховщика закрыта за 45 суток"

observed_until: 2026-03-01T00:00:00
observed_until_source: "популяция кончается 2025-12-31; 45 суток срока доводят последнюю жалобу до 2026-02-14, ещё две недели — запас на то, чтобы закрытие успело попасть в выгрузку от 2026-09-07"

# --- ДОПУЩЕНИЯ ---------------------------------------------------------------

assumptions:
  - statement: "моментом решения является получение жалобы департаментом"
    basis: domain_knowledge
    author: "автор"
    consequence: "если жалоба регистрируется позже фактического обращения, момент выбран позже, чем он происходит, и часть ожидания выпадает из счёта"

  - statement: "строка источника есть пара «жалоба × ответчик», и свёртки к жалобе построитель не делает"
    basis: domain_knowledge
    author: "автор"
    consequence: "64 580 строк на 61 149 номеров жалоб; пара уникальна, повторов ноль. Ключ строки СОБИРАЕТСЯ построителем из двух колонок — готового в источнике нет, — и ядро этого действия не видит (класс 13 журнала)"

  - statement: "наблюдаемость исхода 100% есть свойство отбора, а не процесса"
    basis: domain_knowledge
    author: "автор"
    consequence: "незакрытых жалоб в наборе ноль из 37 070 за 2025–2026: департамент публикует жалобу, когда закрывает её. Значит выборка отобрана по наступлению события, и доля закрытых к сроку описывает только опубликованные жалобы. Следа этого отбора внутри данных нет, и предсказание P-10 говорит, что ядро его не увидит"

  - statement: "срок в 45 суток объявлен с опорой на публикуемые TDI сроки ответа компании"
    basis: domain_knowledge
    author: "автор"
    consequence: "15 дней на ответ, продление 10, для авто- и домашнего страхования 25 — верхняя граница 35 суток, 45 округляет её вверх. Страница tdi.texas.gov из рабочего окружения недоступна, числа взяты из поисковой выдачи: если норматив иной, срок смещён на 10–15 суток"

  - statement: "признаки, проставляемые по итогам рассмотрения, объявлены ignored, а не признаками"
    basis: domain_knowledge
    author: "автор"
    consequence: "`disposition`, `complaint_confirmed_code`, `keyword`, `involved_party_type` и `reason` могли бы оказаться сильными признаками. Момент их заполнения автору неизвестен, и объявить их доступными в момент подачи значило бы утверждать то, чего он не знает"

# --- СХЕМА -------------------------------------------------------------------

columns:
  - {name: case_id, role: entity_id}
  - {name: complaint_number, role: natural_key}
  - {name: received_at, role: decision_time, temporal: instant}
  - {name: closed_at, role: event_time, temporal: instant}
  - {name: due_at, role: deadline, temporal: instant, value_as_of: received_at}

  # Обещано пре-регистрацией §3а: вид жалобы определяет, каким порядком её
  # рассматривают.
  - {name: complaint_type, role: observation_reason}

  # Был контролем К-1: групповой уровень не объявлялся. Ядро НЕ возразило —
  # N14 пропустилась со словами «колонок, похожих на групповой уровень, в
  # данных не найдено», хотя 94.4% строк лежат в компаниях, собравших больше
  # одной жалобы. Разбор в вердикте: эвристика требует, чтобы различных
  # значений было не меньше 10% числа объектов, а 5 286 компаний против
  # 61 149 жалоб дают 8.6%.
  - {name: respondent_id, role: group_id}

  # Признаки, известные в момент получения жалобы.
  - {name: coverage_type, role: feature, availability: at_decision, source_of_claim: "вид покрытия по полису", window_lookback_days: 0, window_source: "выгрузка TDI", value_as_of: received_at}
  - {name: coverage_level, role: feature, availability: at_decision, source_of_claim: "уровень покрытия по полису", window_lookback_days: 0, window_source: "выгрузка TDI", value_as_of: received_at}
  - {name: respondent_type, role: feature, availability: at_decision, source_of_claim: "организация или физическое лицо", window_lookback_days: 0, window_source: "выгрузка TDI", value_as_of: received_at}
  - {name: respondent_role, role: feature, availability: at_decision, source_of_claim: "вид лицензии ответчика", window_lookback_days: 0, window_source: "выгрузка TDI", value_as_of: received_at}
  - {name: complainant_role, role: feature, availability: at_decision, source_of_claim: "кем обратившийся приходится делу", window_lookback_days: 0, window_source: "выгрузка TDI", value_as_of: received_at}
  - {name: complainant_type, role: feature, availability: at_decision, source_of_claim: "обратился человек или организация", window_lookback_days: 0, window_source: "выгрузка TDI", value_as_of: received_at}

  # Известны ПОСЛЕ решения либо момент их заполнения неизвестен.
  - {name: respondent_name, role: ignored}
  - {name: reason, role: ignored}
  - {name: disposition, role: ignored}
  - {name: complaint_confirmed_code, role: ignored}
  - {name: involved_party_type, role: ignored}
  - {name: keyword, role: ignored}

# --- КОНТРАКТ ИСХОДА ---------------------------------------------------------

outcome:
  event_column: closed_at
  deadline_column: due_at
  comparison: direct
  positive_class: event_within_deadline
  event_name: "закрытие жалобы департаментом"
  deadline_name: "45 суток от получения жалобы"
  degenerate_beyond: 0.05

  # ОЖИДАНИЕ И ДОПУСК (N13), объявлены ДО данных.
  expected_positive_rate: 0.55
  expected_within: 0.30

  missing_causes:
    - {name: "жалоба ещё рассматривается", meaning: unobserved,
       assumption: "колонки состояния в наборе нет, и строк без даты закрытия в нём ноль. Причина объявлена не потому, что такие строки есть, а потому, что они СУЩЕСТВУЮТ У ДЕПАРТАМЕНТА и не публикуются: жалоба попадает в набор закрытой. Объявить причину пустой нельзя — ядро требует хотя бы одной, — а объявить её `not_occurred` значило бы сказать, что нерассмотренных жалоб не бывает"}

# --- ТИП ЗАДАЧИ --------------------------------------------------------------

task:
  target_kind: binary
  outcome_timing: delayed
  # Объявлялось true и опровергнуто ядром: `premise_mismatch` — колонки
  # состояния в наборе нет вовсе. Процесс рассмотрения у департамента,
  # разумеется, есть; в ДАННЫХ его нет, а предпосылка говорит о данных.
  has_process: false
  is_stream: true

  # Был контролем К-2: жизненный цикл объявлялся одноразовым. Ядро возразило
  # `surrogate_key_as_entity` — 64 580 ключей строки против 61 149 номеров
  # жалоб. Первое срабатывание A2 на настоящих данных за девятнадцать кейсов.
  object_lifetime: recurring

# --- СПЛИТ -------------------------------------------------------------------
# Отсчёт от 2023-01-01. Период — 1 095 дней.
#
# Первое окно сдвинуто на полгода: обучающая часть окна есть всё, что стало
# известно ДО его начала, и в день 0 прошлого нет. Ошибка восемнадцатого кейса,
# записанная его формуляром, здесь не повторяется.

split:
  windows:
    - {name: w0, start_day: 180, stop_day: 460}     # 2023-06-30 .. 2024-04-05
    - {name: w1, start_day: 460, stop_day: 730}     # 2024-04-05 .. 2024-12-31
    - {name: w2, start_day: 730, stop_day: 920}     # 2024-12-31 .. 2025-07-09
  reserve_from_day: 920                             # 2025-07-09
  reserve_until_day: 1095                           # 2025-12-31
