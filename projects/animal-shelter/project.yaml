# ФОРМА ПЯТНАДЦАТОГО КЕЙСА
#
# Предсказывается: чем и в какой срок завершится пребывание животного в приюте.
#
# Кейс несёт ДВЕ новые оси: конкуренцию видов события (N12 не работала ни в
# одном из четырнадцати кейсов) и несовпадение единицы решения с объектом
# (животное поступает много раз). В первом прогоне присутствуют контроли К-1 и
# К-3 §5 пре-регистрации; К-2 неприменим — соединение вперёд по времени не
# допускает исхода раньше приёма, проверено счётом: 0 строк.

title: "Приют Остина: чем завершится пребывание животного в течение семи суток"

# Конец наблюдения: последний день популяции приёмов плюс год запаса. Исходы
# собраны по 2024-12-31 именно для этого.
observed_until: 2025-01-01T00:00:00
observed_until_source: "приёмы кончаются 2023-12-31; исходы собраны на год дальше, чтобы пребывание, начатое в декабре, имело возможность завершиться"

# --- ДОПУЩЕНИЯ ---------------------------------------------------------------

assumptions:
  - statement: "моментом решения является приём животного в приют"
    basis: domain_knowledge
    author: "автор"
    consequence: "если решения о пристройстве принимаются позже — после осмотра или карантина, — момент выбран раньше, чем он происходит, и время карантина попадает в исход"

  - statement: "единицей решения является пребывание, а не животное"
    basis: data
    author: "автор"
    evidence: "расчёт: 17.4% приёмов приходится на животных, поступавших более одного раза; животных 105 200 при 116 697 приёмах"
    consequence: "если приют ведёт историю животного и решает по ней, объект объявлен мельче нужного, и зависимость между пребываниями одного животного остаётся невидимой"

  - statement: "исходом пребывания является ПЕРВОЕ выбытие после приёма"
    basis: domain_knowledge
    author: "автор"
    consequence: "соединение идёт вперёд по времени; если запись о выбытии заводится задним числом позже следующего приёма, исход достанется не своему пребыванию"

  - statement: "назначенного приютом срока в данных нет"
    basis: data
    author: "автор"
    evidence: "проверено до опечатывания: колонки со сроком нет ни в наборе приёмов, ни в наборе исходов"
    consequence: "допуск выбран правилом на объявленном порядке кандидатов; если приют держит норматив вне выгрузки, объявленные семь суток могут расходиться с настоящим"

  - statement: "разные виды исхода не наступают одновременно"
    basis: data
    author: "автор"
    evidence: "расчёт: из 128 427 пар (животное, момент) ни одна не несёт двух РАЗНЫХ видов исхода; 19 пар с несколькими записями относятся к одному виду"
    consequence: "если приют регистрирует составной исход двумя записями с одинаковой отметкой времени, объявление ложно и цензура одного вида другим посчитана неверно"

  - statement: "у 31 пребывания ключ совпадает с другим: животное принято дважды в ту же секунду"
    basis: data
    author: "автор"
    evidence: "расчёт при сборке: stay_id уникален в 116 666 случаях из 116 697"
    consequence: "либо это повторная запись одного приёма, либо ключ пребывания собран слишком грубо; в обоих случаях две строки описывают одно решение"

# --- СХЕМА -------------------------------------------------------------------

columns:
  - {name: stay_id, role: entity_id}
  - {name: animal_id, role: natural_key}
  - {name: intake_at, role: decision_time, temporal: instant}
  - {name: outcome_at, role: event_time, temporal: instant}
  - {name: due_at, role: deadline, temporal: instant, value_as_of: intake_at}
  - {name: stay_status, role: status}
  - {name: outcome_type, role: event_kind}

  # Признаки, известные в момент приёма.
  - {name: intake_type, role: feature, availability: at_decision, source_of_claim: "обстоятельство приёма, записываемое при поступлении", window_lookback_days: 0, window_source: "выгрузка приютa", value_as_of: intake_at}
  - {name: intake_condition, role: feature, availability: at_decision, source_of_claim: "состояние животного при поступлении", window_lookback_days: 0, window_source: "выгрузка приютa", value_as_of: intake_at}
  - {name: animal_type, role: feature, availability: at_decision, source_of_claim: "вид животного", window_lookback_days: 0, window_source: "выгрузка приютa", value_as_of: intake_at}
  - {name: sex_upon_intake, role: feature, availability: at_decision, source_of_claim: "пол и стерилизованность на момент приёма", window_lookback_days: 0, window_source: "выгрузка приютa", value_as_of: intake_at}
  - {name: age_upon_intake, role: feature, availability: at_decision, source_of_claim: "возраст на момент приёма", window_lookback_days: 0, window_source: "выгрузка приютa", value_as_of: intake_at}
  - {name: breed, role: feature, availability: at_decision, source_of_claim: "порода, определяемая при приёме", window_lookback_days: 0, window_source: "выгрузка приютa", value_as_of: intake_at}
  - {name: color, role: feature, availability: at_decision, source_of_claim: "окрас, записываемый при приёме", window_lookback_days: 0, window_source: "выгрузка приютa", value_as_of: intake_at}

  # КОНТРОЛЬ К-1. Уточнение исхода проставляется ПРИ ВЫБЫТИИ, то есть после
  # исхода. Момент фиксации объявлен честно — собой. Ядру о подлоге не
  # сообщается.
  - {name: outcome_subtype, role: feature, availability: at_decision, source_of_claim: "уточнение обстоятельств выбытия", window_lookback_days: 0, window_source: "выгрузка приютa", value_as_of: outcome_at}

  - {name: found_location, role: ignored}
  - {name: date_of_birth, role: ignored, temporal: date}
  - {name: sex_upon_outcome, role: ignored}
  - {name: age_upon_outcome, role: ignored}
  - {name: stay_days, role: ignored}

# --- КОНТРАКТ ИСХОДА ---------------------------------------------------------

outcome:
  event_column: outcome_at
  deadline_column: due_at
  comparison: direct
  positive_class: event_within_deadline
  event_name: "выбытие животного из приюта"
  deadline_name: "семь суток от приёма"
  degenerate_beyond: 0.05

  missing_causes:
    - {name: "животное выбыло", meaning: not_occurred, status_value: "выбыло",
       assumption: "выбывшее животное без отметки времени выбытия означало бы потерю записи, а не отсутствие выбытия; таких строк в популяции нет"}
    - {name: "животное ещё в приюте", meaning: unobserved, status_value: "в приюте",
       assumption: "пребывание не завершилось к концу наблюдения; читать его отрицательным исходом значило бы объявить наблюдением то, чего не наблюдали"}
    - {name: "вид исхода не записан", meaning: unobserved, status_value: "вид не записан",
       assumption: "момент выбытия есть, а вид пуст: чем кончилось пребывание, неизвестно, и свести это с ещё не завершёнными нельзя"}

# --- ТИП ЗАДАЧИ --------------------------------------------------------------

task:
  target_kind: competing
  outcome_timing: delayed
  has_process: true
  is_stream: true
  object_lifetime: recurring
  # Одновременность объявлена невозможной. Основание двойное: структурное —
  # животное выбывает из приюта один раз за пребывание, и усыновление с
  # эвтаназией взаимно исключены; счётное — 0 из 128 427 пар несут два разных
  # вида в один момент.
  simultaneous_kinds: not_possible

# --- СПЛИТ -------------------------------------------------------------------
# Отсчёт от 2016-01-01. Метка зреет за семь суток, поэтому окна ставятся
# вплотную. Первый год целиком уходит в обучение первого окна.

split:
  windows:
    - {name: w0, start_day: 366, stop_day: 1096}    # 2017 — 2018
    - {name: w1, start_day: 1096, stop_day: 1827}   # 2019 — 2020
    - {name: w2, start_day: 1827, stop_day: 2557}   # 2021 — 2022
  reserve_from_day: 2557                            # 2023 год целиком
  reserve_until_day: 2922
